[package]
name = "lora-chat"
version = "0.1.0"
edition = "2021"
description = "Privacy-first Linux TUI LoRa chat for RAK4631 / WisBlock hardware"
license = "MIT"
authors = ["Mauro Parra <mauropm@gmail.com>"]

[[bin]]
name = "lora-chat"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
async-trait = "0.1"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
serialport = "4"
tokio-serial = "5.4"
btleplug = { version = "0.11", optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["ble"]
ble = ["btleplug"]

[profile.release]
lto = "thin"
strip = true
